<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        
        <link href="https://fonts.googleapis.com/css?family=Josefin+Sans:300,400,400i|Nunito:300,300i" rel="stylesheet">
        <link rel="stylesheet" href="css/style.css">
        <link rel="shortcut icon" type="image/png" href="img/favicon.png">
        
        <title>nexter &mdash; your home, your freedom</title>
    </head>
    <body>
        <div class="container">
            <header class="header">
                <img src="img/logo.png" alt="trillo logo" class="logo">

                <form action="#" class="search">
                    <input type="text" class="search__input" placeholder="Search hotels">
                    <button class="search__button">
                       <img src="./img/mine.svg" alt="Mine Icon" width="24" height="24" class="search__icon">
                    </button>
                </form>

                <nav class="user-nav">
                    <div class="user-nav__icon-box">
                        <img src="./img/mine.svg" alt="Mine Icon" width="24" height="24">
                        <span class="user-nav__notification">7</span>
                    </div>
                      <div class="user-nav__icon-box">
                        <img src="./img/mine.svg" alt="Mine Icon" width="24" height="24">
                        <span class="user-nav__notification">7</span>
                    </div>
                    <div class="user-nav__user">
                        <img src="img/user-1.jpg" alt="random" class="user-nav__user-photo">
                    </div>
                </nav>
            </header>


            <div class="content">
                <nav class="sidebar">
                    <ul class="side-nav">
                        <li class="side-nav__item side-nav__item--active">
                            <a href="#" class="side-nav__link">
                                 <img src="img/mine.svg" alt="random" class="side-nav__icon">
                                 <span>Hotel</span>
                            </a>
                        </li>

                        <li class="side-nav__item">
                            <a href="#" class="side-nav__link">
                                 <img src="img/mine.svg" alt="random" class="side-nav__icon">
                                 <span>Flight</span>
                            </a>
                        </li>

                        <li class="side-nav__item">
                            <a href="#" class="side-nav__link">
                                 <img src="img/mine.svg" alt="random" class="side-nav__icon">
                                 <span>Car rental</span>
                            </a>
                        </li>

                        <li class="side-nav__item">
                            <a href="#" class="side-nav__link">
                                 <img src="img/mine.svg" alt="random" class="side-nav__icon">
                                 <span>Tours</span>
                            </a>
                        </li>
                    </ul>

                    <div class="legal">&copy; 2025 trillo.</div>
                </nav>

                


                <main class="hotel-view">Main</main>
            </div>
        </div>
    </body>
</html>
